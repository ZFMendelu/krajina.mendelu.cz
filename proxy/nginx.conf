worker_processes 1;

events {
    worker_connections 768;
}

http {
    include mime.types;
    server_tokens off;
    charset utf-8;

    # Default server
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    # krajina.local → static files + PHP-FPM
    server {
        listen 80;
        server_name krajina.local *.krajina.local;
        root /srv/public;
        client_max_body_size 128M;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass web:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_buffers 64 4K;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }

        error_log /var/log/nginx/error.log;
        access_log /var/log/nginx/access.log;
    }

    # adminer.krajina.local → adminer
    server {
        listen 80;
        server_name adminer.krajina.local;
        client_max_body_size 128M;

        location / {
            proxy_pass http://adminer:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }

    # mailer.krajina.local → mailpit web UI
    server {
        listen 80;
        server_name mailer.krajina.local;
        client_max_body_size 128M;

        location / {
            proxy_pass http://mailer:8025;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }
    }
}
